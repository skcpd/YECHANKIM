<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>취업 대시보드</title>
<meta name="theme-color" content="#2563eb">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="취업">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M14 46V32h8v14zM28 46V20h8v26zM42 46V12h8v34z' fill='white'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="touchIcon" href="">
<style>
:root{
  --bg:#f4f6fb;--card:#ffffff;--ink:#0f172a;--sub:#64748b;--line:#e2e8f0;
  --acc:#2563eb;--accbg:#dbeafe;--ok:#16a34a;--okbg:#dcfce7;--warn:#dc2626;--warnbg:#fee2e2;
  --gray:#94a3b8;--graybg:#eef1f6;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1020;--card:#151b2e;--ink:#e8ecf5;--sub:#94a3b8;--line:#27314b;
    --acc:#60a5fa;--accbg:#1e3a6e;--ok:#4ade80;--okbg:#14391f;--warn:#f87171;--warnbg:#4a1d1d;
    --gray:#64748b;--graybg:#1d2540;--shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:16px;line-height:1.4}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:var(--ink)}
.wrap{max-width:980px;margin:0 auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:22px;margin:0;font-weight:800}
h2{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:700}
.streak{background:var(--accbg);color:var(--acc);font-weight:800;padding:6px 12px;border-radius:99px;font-size:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:30px;line-height:1.1;color:var(--acc)}
.kpi span{font-size:13px;color:var(--sub)}
.kpi.ok b{color:var(--ok)}
.donutrow{display:flex;align-items:center;gap:14px;justify-content:center}
.dc{font-size:22px;font-weight:800;fill:var(--ink)}
.ds{font-size:8px;fill:var(--sub)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.bar{fill:var(--acc)}.bar.dim{opacity:.35}
.lab{fill:var(--sub);font-size:11px}.val{fill:var(--ink);font-size:11px;font-weight:700}
.frow{display:grid;grid-template-columns:64px 1fr 62px;gap:8px;align-items:center;margin:9px 0;font-size:14px}
.ftrack{background:var(--graybg);border-radius:8px;height:22px;overflow:hidden}
.ffill{height:100%;background:var(--acc);border-radius:8px;min-width:4px;transition:width .4s}
.frow:nth-child(4) .ffill{opacity:.8}.frow:nth-child(5) .ffill{opacity:.65}
.frow.win .ffill{background:var(--ok)}
.frow .n{text-align:right;color:var(--sub);font-size:13px}.frow .n b{color:var(--ink);font-size:15px}
.dlist{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--graybg);border:0;width:100%;text-align:left}
.dd{min-width:58px;text-align:center;font-weight:800;font-size:18px;color:var(--acc)}
.dd.hot{color:var(--warn)}
.dinfo{flex:1;min-width:0}.dinfo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dinfo span{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.empty{color:var(--sub);text-align:center;padding:18px 8px;font-size:14px}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--graybg);color:var(--sub);white-space:nowrap}
.chip.s1{background:var(--accbg);color:var(--acc)}
.chip.s2{background:#ccfbf1;color:#0f766e}
.chip.s3{background:#ede9fe;color:#6d28d9}
.chip.s4{background:var(--okbg);color:var(--ok)}
.chip.s5{background:var(--graybg);color:var(--gray);text-decoration:line-through}
@media (prefers-color-scheme:dark){.chip.s2{background:#0f3d3a;color:#5eead4}.chip.s3{background:#2e2459;color:#c4b5fd}}
.chip.hot{background:var(--warnbg);color:var(--warn)}
.pill{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600}
.pill.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (prefers-color-scheme:dark){.pill.on{color:#0b1020}}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.scroll .pill{flex:none}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.item .main{flex:1;min-width:0}
.item .main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .main span{font-size:13px;color:var(--sub)}
.item.past{opacity:.55}
.x{border:0;background:transparent;color:var(--sub);font-size:20px;padding:4px 8px;border-radius:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:transparent;padding:9px 0 8px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--acc);font-weight:800}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;border:0;background:var(--acc);color:#fff;
  font-weight:800;font-size:16px;padding:14px 20px;border-radius:99px;box-shadow:0 6px 18px rgba(37,99,235,.4)}
@media (prefers-color-scheme:dark){.fab{color:#0b1020}}
#sheet{position:fixed;inset:0;background:rgba(2,6,23,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.on{display:flex}
#sheetBody{width:100%;max-width:560px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:90vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:700px){#sheet{align-items:center}#sheetBody{border-radius:22px}}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px;font-weight:700}
input[type=text],input[type=date],input[type=number]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;padding:14px;border-radius:14px;font-weight:800;font-size:16px;background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.btn{color:#0b1020}}
.btn.ghost{background:var(--graybg);color:var(--ink)}
.btn.danger{background:var(--warnbg);color:var(--warn);flex:0 0 auto;padding:14px 18px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set input{width:90px;text-align:center}
.mini{font-size:13px;color:var(--sub)}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">취업 대시보드</h1>
    <div class="streak" id="streak"></div>
  </header>
  <main id="view"></main>
</div>

<button class="fab" id="fab" data-act="fab"></button>
<nav>
  <button data-act="tab" data-v="home"><span>🏠</span>홈</button>
  <button data-act="tab" data-v="apps"><span>📋</span>지원</button>
  <button data-act="tab" data-v="logs"><span>⏱️</span>활동</button>
  <button data-act="tab" data-v="set"><span>⚙️</span>설정</button>
</nav>
<div id="sheet" data-act="sheet-bg"><div id="sheetBody"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<noscript>자바스크립트를 켜 주세요.</noscript>

<script>
(function(){
'use strict';
/* ---------- 상수 ---------- */
var KEY='jobdash.v1';
var CATS=[['공부','#2563eb'],['포트폴리오','#0d9488'],['자소서','#d97706'],['면접준비','#7c3aed'],['기타','#94a3b8']];
var STAT=['관심','지원','서류통과','면접','합격','탈락'];
var RANK={'관심':0,'지원':1,'서류통과':2,'면접':3,'합격':4};
var TABS=['home','apps','logs','set'];
var DOW=['월','화','수','목','금','토','일'];

/* ---------- 저장 ---------- */
var S=load();
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY));
    if(d&&Array.isArray(d.apps)&&Array.isArray(d.logs)){d.goal=+d.goal>0?+d.goal:20;d.visits=Array.isArray(d.visits)?d.visits:[];return d;}
  }catch(e){}
  return {apps:[],logs:[],goal:20,visits:[]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('저장 실패: 브라우저 저장 공간을 확인하세요');}}

/* ---------- 날짜 ---------- */
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return ymd(new Date());}
function utc(s){var p=s.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]);}
function diff(a,b){return Math.round((utc(b)-utc(a))/864e5);}
function addDays(s,n){var p=s.split('-').map(Number);return ymd(new Date(p[0],p[1]-1,p[2]+n));}
function weekStart(s){var p=s.split('-').map(Number);var w=(new Date(p[0],p[1]-1,p[2]).getDay()+6)%7;return addDays(s,-w);}
function dday(s){return diff(today(),s);}

/* ---------- 유틸 ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(m){var h=Math.floor(m/60),r=m%60;return h&&r?h+'시간 '+r+'분':h?h+'시간':r+'분';}
function hr(m){return Math.round(m/6)/10;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
var tt;function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('on');},1800);}

/* ---------- 연속 접속 ---------- */
function touchVisit(){var t=today();if(S.visits.indexOf(t)<0){S.visits.push(t);S.visits=S.visits.slice(-400);save();}}
function streak(){var set={};S.visits.forEach(function(v){set[v]=1;});var n=0,d=today();while(set[d]){n++;d=addDays(d,-1);}return n;}

/* ---------- 계산 ---------- */
function weekMins(startStr){
  var a=[0,0,0,0,0,0,0];
  S.logs.forEach(function(l){var i=diff(startStr,l.date);if(i>=0&&i<7)a[i]+=l.min;});
  return a;
}
function sum(a){return a.reduce(function(x,y){return x+y;},0);}
function funnel(){
  var c=[0,0,0,0];
  S.apps.forEach(function(a){var r=a.maxStage||0;for(var i=1;i<=4;i++){if(r>=i)c[i-1]++;}});
  return c;
}
function catTotals(startStr){
  var t={};CATS.forEach(function(c){t[c[0]]=0;});
  S.logs.forEach(function(l){var i=diff(startStr,l.date);if(i>=0&&i<7&&t[l.cat]!=null)t[l.cat]+=l.min;});
  return t;
}

/* ---------- 그래프 ---------- */
function donut(segs,total,center,sub){
  var r=48,C=2*Math.PI*r,off=0;
  var arcs=segs.filter(function(s){return s.v>0&&total>0;}).map(function(s){
    var len=C*Math.min(s.v,total)/total;
    var el='<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+s.c+'" stroke-width="14" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 60 60)"/>';
    off+=len;return el;}).join('');
  return '<svg viewBox="0 0 120 120" width="140" height="140" role="img" aria-label="'+esc(center+' '+sub)+'">'+
    '<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="14"/>'+arcs+
    '<text x="60" y="62" text-anchor="middle" class="dc">'+esc(center)+'</text>'+
    '<text x="60" y="76" text-anchor="middle" class="ds">'+esc(sub)+'</text></svg>';
}
function bars(vals,labels,hi,future){
  var n=vals.length,W=300,H=150,base=122,top=22,slot=W/n,bw=Math.min(34,slot*.58);
  var max=Math.max.apply(null,vals.concat([60]));
  var out='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="막대 그래프">';
  out+='<line x1="0" x2="'+W+'" y1="'+base+'" y2="'+base+'" stroke="var(--line)"/>';
  for(var i=0;i<n;i++){
    var h=Math.round((base-top)*vals[i]/max),x=slot*i+(slot-bw)/2;
    var dim=(future&&i>hi)||(!future&&i!==hi);
    if(vals[i]>0){out+='<rect class="bar'+(dim?' dim':'')+'" x="'+x+'" y="'+(base-h)+'" width="'+bw+'" height="'+h+'" rx="6"/>';
      out+='<text class="val" x="'+(x+bw/2)+'" y="'+(base-h-5)+'" text-anchor="middle">'+hr(vals[i])+'</text>';}
    else{out+='<rect class="bar dim" x="'+x+'" y="'+(base-3)+'" width="'+bw+'" height="3" rx="1.5"/>';}
    out+='<text class="lab" x="'+(x+bw/2)+'" y="'+(base+16)+'" text-anchor="middle">'+esc(labels[i])+'</text>';
  }
  return out+'</svg>';
}

/* ---------- 상태 ---------- */
var tab=(location.hash||'').slice(1);if(TABS.indexOf(tab)<0)tab='home';
var filter='전체';
var draft={};
var deferred=null;

function statClass(s){var i=STAT.indexOf(s);return 's'+i;}
function ddChip(a){
  if(!a.deadline)return '';
  var d=dday(a.deadline);
  if(a.status!=='관심')return '<span class="chip">'+esc(a.deadline.slice(5).replace('-','/'))+'</span>';
  if(d<0)return '<span class="chip">마감</span>';
  return '<span class="chip'+(d<=3?' hot':'')+'">'+(d===0?'D-Day':'D-'+d)+'</span>';
}

/* ---------- 화면: 홈 ---------- */
function vHome(){
  var ws=weekStart(today()),wk=weekMins(ws),tot=sum(wk),goalM=S.goal*60;
  var pct=goalM?Math.min(100,Math.round(tot/goalM*100)):0;
  var f=funnel(),ti=diff(ws,today());
  var kp='<div class="kpis"><div class="kpi"><b>'+f[0]+'</b><span>지원</span></div>'+
    '<div class="kpi"><b>'+f[2]+'</b><span>면접</span></div>'+
    '<div class="kpi ok"><b>'+f[3]+'</b><span>합격</span></div></div>';
  var goal='<div class="card"><h2>🎯 목표 달성률</h2><div class="donutrow">'+
    donut([{v:pct,c:'var(--acc)'}],100,pct+'%',hr(tot)+' / '+S.goal+'시간')+
    '<div class="legend"><div><b>'+hr(tot)+'</b> 시간</div><div class="mini">남은 '+Math.max(0,hr(goalM-tot))+'시간</div></div></div></div>';
  var week='<div class="card"><h2>📊 주간 활동량 (시간)</h2>'+bars(wk,DOW,ti,true)+'</div>';
  var names=['지원','서류통과','면접','합격'],mx=Math.max(f[0],1),fn='';
  for(var i=0;i<4;i++){
    var share=i===0?'':(f[i-1]?Math.round(f[i]/f[i-1]*100)+'%':'-');
    fn+='<div class="frow'+(i===3?' win':'')+'"><span>'+names[i]+'</span><div class="ftrack"><div class="ffill" style="width:'+Math.round(f[i]/mx*100)+'%"></div></div>'+
      '<span class="n"><b>'+f[i]+'</b> '+share+'</span></div>';
  }
  var funnelCard='<div class="card"><h2>🧭 지원 퍼널</h2>'+fn+'</div>';
  var due=S.apps.filter(function(a){return a.status==='관심'&&a.deadline&&dday(a.deadline)>=0;})
    .sort(function(a,b){return a.deadline<b.deadline?-1:1;}).slice(0,3);
  var dl=due.length?'<div class="dlist">'+due.map(function(a){var d=dday(a.deadline);
    return '<button class="drow" data-act="app-edit" data-id="'+a.id+'"><div class="dd'+(d<=3?' hot':'')+'">'+(d===0?'D-Day':'D-'+d)+'</div>'+
      '<div class="dinfo"><b>'+esc(a.company)+'</b><span>'+esc(a.role||'')+'</span></div></button>';}).join('')+'</div>'
    :'<div class="empty">임박한 마감이 없어요</div>';
  var ddCard='<div class="card"><h2>⏰ 마감 D-day</h2>'+dl+'</div>';
  return kp+'<div class="grid">'+goal+week+funnelCard+ddCard+'</div>';
}

/* ---------- 화면: 지원 ---------- */
function vApps(){
  var chips='<div class="scroll">'+['전체'].concat(STAT).map(function(s){
    return '<button class="pill'+(filter===s?' on':'')+'" data-act="filter" data-v="'+s+'">'+s+'</button>';}).join('')+'</div>';
  var list=S.apps.filter(function(a){return filter==='전체'||a.status===filter;}).sort(function(a,b){
    var ra=a.status==='탈락'?1:0,rb=b.status==='탈락'?1:0;if(ra!==rb)return ra-rb;
    var da=a.deadline||'9999',db=b.deadline||'9999';if(da!==db)return da<db?-1:1;
    return (b.created||0)-(a.created||0);});
  var html=list.length?list.map(function(a){
    var past=a.status==='관심'&&a.deadline&&dday(a.deadline)<0;
    return '<button class="item'+(past?' past':'')+'" data-act="app-edit" data-id="'+a.id+'"><div class="main"><b>'+esc(a.company)+'</b><span>'+esc(a.role||'직무 없음')+(a.memo?' · '+esc(a.memo):'')+'</span></div>'+
      ddChip(a)+'<span class="chip '+statClass(a.status)+'">'+a.status+'</span></button>';}).join('')
    :'<div class="empty">📭 아직 없어요<br>아래 버튼으로 추가하세요</div>';
  return chips+html;
}

/* ---------- 화면: 활동 ---------- */
function vLogs(){
  var ws=weekStart(today()),ct=catTotals(ws),tot=sum(Object.keys(ct).map(function(k){return ct[k];}));
  var segs=CATS.map(function(c){return {v:ct[c[0]],c:c[1]};});
  var lg=CATS.map(function(c){return '<div><i style="background:'+c[1]+'"></i>'+c[0]+' <b>'+(ct[c[0]]?fmt(ct[c[0]]):'-')+'</b></div>';}).join('');
  var donutCard='<div class="card"><h2>🍩 이번 주 종류별</h2>'+(tot?'<div class="donutrow">'+donut(segs,tot,hr(tot)+'h','합계')+'<div class="legend">'+lg+'</div></div>':'<div class="empty">기록이 없어요</div>')+'</div>';
  var wv=[],wl=[];
  for(var i=3;i>=0;i--){var s=addDays(ws,-7*i);wv.push(sum(weekMins(s)));wl.push(s.slice(5).replace('-','/'));}
  var trend='<div class="card"><h2>📈 최근 4주 (시간)</h2>'+bars(wv,wl,3,false)+'</div>';
  var rec=S.logs.slice().sort(function(a,b){return a.date===b.date?(b.t||0)-(a.t||0):(a.date<b.date?1:-1);}).slice(0,30);
  var color={};CATS.forEach(function(c){color[c[0]]=c[1];});
  var list=rec.length?rec.map(function(l){
    return '<div class="item"><div class="main"><b><i style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:'+(color[l.cat]||'#94a3b8')+'"></i>'+esc(l.cat)+' · '+fmt(l.min)+'</b><span>'+l.date.slice(5).replace('-','/')+'</span></div>'+
      '<button class="x" data-act="log-del" data-id="'+l.id+'" aria-label="삭제">✕</button></div>';}).join('')
    :'<div class="empty">⏱️ 기록이 없어요<br>아래 버튼으로 추가하세요</div>';
  return '<div class="grid">'+donutCard+trend+'</div><h2 style="margin-top:18px">🕘 최근 기록</h2>'+list;
}

/* ---------- 화면: 설정 ---------- */
function vSet(){
  var inst=deferred?'<div class="set"><span>홈 화면에 추가</span><button class="pill on" data-act="install">설치</button></div>':
    '<div class="set"><span>홈 화면에 추가</span><span class="mini">공유 · 메뉴 → 홈 화면에 추가</span></div>';
  return '<div class="card">'+
    '<div class="set"><span>주간 목표 (시간)</span><input id="goal" type="number" min="1" max="100" inputmode="numeric" value="'+S.goal+'"></div>'+
    '<div class="set"><span>연속 접속</span><b>🔥 '+streak()+'일</b></div>'+
    inst+
    '<div class="set"><span>백업 파일 저장</span><button class="pill" data-act="export">내보내기</button></div>'+
    '<div class="set"><span>백업 파일 불러오기</span><button class="pill" data-act="import">가져오기</button></div>'+
    '<div class="set"><span>모든 데이터 삭제</span><button class="pill" style="color:var(--warn)" data-act="reset">삭제</button></div>'+
    '</div><p class="mini" style="text-align:center;margin-top:14px">데이터는 이 기기 브라우저에만 저장돼요<br>기기를 바꿀 땐 백업을 쓰세요</p>';
}

/* ---------- 렌더 ---------- */
function render(){
  var titles={home:'취업 대시보드',apps:'지원 현황',logs:'준비 활동',set:'설정'};
  $('#title').textContent=titles[tab];
  $('#streak').textContent='🔥 '+streak()+'일';
  $('#view').innerHTML={home:vHome,apps:vApps,logs:vLogs,set:vSet}[tab]();
  Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(b){b.classList.toggle('on',b.dataset.v===tab);});
  var fab=$('#fab');
  if(tab==='apps'){fab.textContent='＋ 지원 추가';fab.style.display='';}
  else if(tab==='set'){fab.style.display='none';}
  else{fab.textContent='＋ 활동 기록';fab.style.display='';}
}
function go(t){tab=t;try{history.replaceState(null,'','#'+t);}catch(e){}render();window.scrollTo(0,0);}

/* ---------- 시트 ---------- */
function openSheet(h){$('#sheetBody').innerHTML=h;$('#sheet').classList.add('on');}
function closeSheet(){$('#sheet').classList.remove('on');}

function logSheet(){
  draft={cat:CATS[0][0],min:60};
  var pills=CATS.map(function(c){return '<button class="pill'+(c[0]===draft.cat?' on':'')+'" data-act="cat" data-v="'+c[0]+'">'+c[0]+'</button>';}).join('');
  var quick=[30,60,90,120,180].map(function(m){return '<button class="pill" data-act="minchip" data-v="'+m+'">'+fmt(m)+'</button>';}).join('');
  openSheet('<h2 style="color:var(--ink);font-size:18px">⏱️ 활동 기록</h2>'+
    '<label>종류</label><div class="pills" id="catPills">'+pills+'</div>'+
    '<label>시간 (분)</label><input id="f-min" type="number" min="1" max="1440" inputmode="numeric" value="60">'+
    '<div class="pills" style="margin-top:10px">'+quick+'</div>'+
    '<label>날짜</label><input id="f-date" type="date" value="'+today()+'" max="'+today()+'">'+
    '<div class="row"><button class="btn ghost" data-act="sheet-close">취소</button><button class="btn" data-act="log-save">저장</button></div>');
}
function appSheet(id){
  var a=id?S.apps.filter(function(x){return x.id===id;})[0]:null;
  draft={id:a?a.id:null,status:a?a.status:'관심'};
  var pills=STAT.map(function(s){return '<button class="pill'+(s===draft.status?' on':'')+'" data-act="stat" data-v="'+s+'">'+s+'</button>';}).join('');
  openSheet('<h2 style="color:var(--ink);font-size:18px">'+(a?'📝 지원 수정':'📋 지원 추가')+'</h2>'+
    '<label>회사명</label><input id="f-company" type="text" maxlength="40" value="'+esc(a?a.company:'')+'">'+
    '<label>직무</label><input id="f-role" type="text" maxlength="40" value="'+esc(a?a.role:'')+'">'+
    '<label>마감일</label><input id="f-deadline" type="date" value="'+esc(a?a.deadline:'')+'">'+
    '<label>상태</label><div class="pills" id="statPills">'+pills+'</div>'+
    '<label>메모</label><input id="f-memo" type="text" maxlength="60" value="'+esc(a?a.memo:'')+'">'+
    '<div class="row">'+(a?'<button class="btn danger" data-act="app-del">삭제</button>':'')+'<button class="btn ghost" data-act="sheet-close">취소</button><button class="btn" data-act="app-save">저장</button></div>');
  if(!a)setTimeout(function(){var e=$('#f-company');if(e)e.focus();},60);
}
function setOn(containerId,val,attr){
  Array.prototype.forEach.call(document.querySelectorAll('#'+containerId+' .pill'),function(b){b.classList.toggle('on',b.dataset.v===val);});
}

/* ---------- 동작 ---------- */
var acts={
  tab:function(el){go(el.dataset.v);},
  fab:function(){if(tab==='apps')appSheet();else logSheet();},
  filter:function(el){filter=el.dataset.v;render();},
  'sheet-close':closeSheet,
  'sheet-bg':function(el,e){if(e.target===el)closeSheet();},
  cat:function(el){draft.cat=el.dataset.v;setOn('catPills',draft.cat);},
  minchip:function(el){$('#f-min').value=el.dataset.v;},
  stat:function(el){draft.status=el.dataset.v;setOn('statPills',draft.status);},
  'log-save':function(){
    var m=Math.round(+$('#f-min').value),d=$('#f-date').value||today();
    if(!(m>0)){toast('시간을 입력하세요');return;}
    S.logs.push({id:uid(),date:d,cat:draft.cat,min:m,t:Date.now()});save();closeSheet();render();toast('저장됨 · '+draft.cat+' '+fmt(m));
  },
  'log-del':function(el){if(confirm('이 기록을 삭제할까요?')){S.logs=S.logs.filter(function(l){return l.id!==el.dataset.id;});save();render();}},
  'app-edit':function(el){appSheet(el.dataset.id);},
  'app-save':function(){
    var c=$('#f-company').value.trim();if(!c){toast('회사명을 입력하세요');return;}
    var rec={company:c,role:$('#f-role').value.trim(),deadline:$('#f-deadline').value,status:draft.status,memo:$('#f-memo').value.trim()};
    var a=draft.id?S.apps.filter(function(x){return x.id===draft.id;})[0]:null;
    if(!a){a={id:uid(),created:Date.now(),maxStage:0};S.apps.push(a);}
    var prev=a.maxStage||0;
    Object.keys(rec).forEach(function(k){a[k]=rec[k];});
    a.maxStage=rec.status==='탈락'?Math.max(prev,1):RANK[rec.status];
    save();closeSheet();render();toast('저장됨');
  },
  'app-del':function(){if(confirm('이 지원을 삭제할까요?')){S.apps=S.apps.filter(function(a){return a.id!==draft.id;});save();closeSheet();render();}},
  export:function(){
    var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download='job-dashboard-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1000);toast('백업 파일 저장');
  },
  import:function(){$('#file').click();},
  reset:function(){if(confirm('모든 데이터를 삭제할까요?\n되돌릴 수 없어요.')){S={apps:[],logs:[],goal:20,visits:[]};touchVisit();save();render();toast('삭제됨');}},
  install:function(){if(deferred){deferred.prompt();deferred=null;render();}}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var f=acts[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('change',function(e){
  if(e.target.id==='goal'){var v=Math.round(+e.target.value);if(v>=1&&v<=100){S.goal=v;save();toast('목표 '+v+'시간');}else{e.target.value=S.goal;}}
});
$('#file').addEventListener('change',function(e){
  var f=e.target.files[0];e.target.value='';if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.apps)||!Array.isArray(d.logs))throw 0;
      if(!confirm('현재 데이터를 백업 파일로 바꿀까요?'))return;
      S={apps:d.apps,logs:d.logs,goal:+d.goal>0?+d.goal:20,visits:Array.isArray(d.visits)?d.visits:[]};touchVisit();save();render();toast('불러오기 완료');
    }catch(x){toast('올바른 백업 파일이 아니에요');}
  };
  r.readAsText(f);
});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;if(tab==='set')render();});
window.addEventListener('hashchange',function(){var t=location.hash.slice(1);if(TABS.indexOf(t)>=0&&t!==tab){tab=t;render();}});
document.addEventListener('visibilitychange',function(){if(!document.hidden){touchVisit();render();}});

/* ---------- 앱 설치 (아이콘·매니페스트·오프라인) ---------- */
function iconPng(size){
  try{
    var c=document.createElement('canvas');c.width=c.height=size;var x=c.getContext('2d'),r=size*.22;
    x.fillStyle='#2563eb';x.beginPath();
    x.moveTo(r,0);x.arcTo(size,0,size,size,r);x.arcTo(size,size,0,size,r);x.arcTo(0,size,0,0,r);x.arcTo(0,0,size,0,r);x.fill();
    x.fillStyle='#fff';var u=size/64;
    [[14,32,8,14],[28,20,8,26],[42,12,8,34]].forEach(function(b){x.fillRect(b[0]*u,(b[1]+4)*u,b[2]*u,b[3]*u);});
    return c.toDataURL('image/png');
  }catch(e){return '';}
}
function setupPwa(){
  var i180=iconPng(180),i192=iconPng(192),i512=iconPng(512);
  if(i180)$('#touchIcon').href=i180;
  try{
    var base=location.origin+location.pathname;
    var mf={name:'취업 대시보드',short_name:'취업',id:base,start_url:base,scope:location.origin+'/',display:'standalone',
      background_color:'#f4f6fb',theme_color:'#2563eb',lang:'ko',
      icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}]};
    var l=document.createElement('link');l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
  }catch(e){}
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('./2026-11-19_sw.js').then(function(){
      if('caches' in window)caches.open('jobdash-v1').then(function(c){return c.add(location.pathname);}).catch(function(){});
    }).catch(function(){});
  }
}

touchVisit();
render();
setupPwa();
})();
</script>
</body>
</html>
