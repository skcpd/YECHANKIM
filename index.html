<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김예찬 — 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1a1a1c;
    --bg-grid: #202023;
    --panel: #232326;
    --panel-header: #2a2a2e;
    --border: #38383c;
    --text: #e6e6e9;
    --text-muted: #93939a;
    --accent: #e8a33d;
    --accent-soft: rgba(232,163,61,0.12);
    --green: #6fcf97;
    --green-soft: rgba(111,207,151,0.12);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans KR', -apple-system, sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, var(--bg-grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}

  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:64px 20px 80px;
  }

  /* ---------- window chrome ---------- */
  .window{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 30px 60px -30px rgba(0,0,0,0.6);
  }
  .window-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 16px;
    background:var(--panel-header);
    border-bottom:1px solid var(--border);
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--text-muted);
  }
  .window-bar .tab{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--green);
    flex:none;
  }
  .dot.blink{ animation:blink 1.6s ease-in-out infinite; }

  .issue-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:3px 9px;
    border:1px solid rgba(232,163,61,0.35);
    background:var(--accent-soft);
    color:var(--accent);
    border-radius:20px;
    font-size:11.5px;
    letter-spacing:0.01em;
  }

  /* ---------- hero / boot sequence ---------- */
  .hero{ padding:40px 28px 36px; }

  .boot-line{
    font-family:var(--mono);
    font-size:13px;
    color:var(--text-muted);
    opacity:0;
    animation:reveal 0.5s ease forwards;
  }
  .boot-line .prompt{ color:var(--green); margin-right:8px; }
  .boot-line:nth-of-type(1){ animation-delay:0.15s; }

  h1.name{
    font-family:var(--sans);
    font-weight:700;
    font-size:clamp(38px, 7vw, 56px);
    line-height:1.1;
    margin:18px 0 10px;
    letter-spacing:-0.01em;
    opacity:0;
    animation:reveal 0.6s ease forwards;
    animation-delay:0.55s;
  }

  .tagline{
    font-size:clamp(16px, 2.4vw, 19px);
    color:var(--text);
    margin:0 0 22px;
    opacity:0;
    animation:reveal 0.6s ease forwards;
    animation-delay:0.85s;
  }
  .tagline .cursor{
    display:inline-block;
    width:2px; height:1em;
    background:var(--accent);
    margin-left:2px;
    vertical-align:-2px;
    animation:blink 1s steps(2,start) infinite;
  }

  .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px 18px;
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--text-muted);
    opacity:0;
    animation:reveal 0.6s ease forwards;
    animation-delay:1.1s;
  }
  .meta-row span{ display:flex; align-items:center; gap:6px; }
  .meta-row .k{ color:var(--text-muted); }

  @keyframes reveal{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes blink{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:0; }
  }

  /* ---------- inspector panels ---------- */
  .panels{ margin-top:28px; display:flex; flex-direction:column; gap:16px; }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }

  .panel-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 18px;
    background:var(--panel-header);
    cursor:pointer;
    user-select:none;
    border:none;
    width:100%;
    text-align:left;
    color:var(--text);
    font-family:var(--sans);
  }
  .panel-header:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }

  .fold{
    font-family:var(--mono);
    color:var(--accent);
    font-size:12px;
    transition:transform 0.25s ease;
    flex:none;
  }
  .panel.collapsed .fold{ transform:rotate(-90deg); }

  .panel-header .title{
    font-weight:600;
    font-size:16px;
  }
  .panel-header .sub{
    margin-left:auto;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
  }

  .panel-body{
    padding:20px 18px 22px;
    display:grid;
    gap:14px;
    max-height:600px;
    transition:max-height 0.35s ease, padding 0.35s ease, opacity 0.25s ease;
    opacity:1;
  }
  .panel.collapsed .panel-body{
    max-height:0;
    padding-top:0; padding-bottom:0;
    opacity:0;
  }

  .field{
    display:grid;
    grid-template-columns:88px 1fr;
    gap:14px;
    font-size:14.5px;
    align-items:start;
  }
  .field .k{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--text-muted);
    padding-top:2px;
  }
  .field .v{ color:var(--text); }

  .tag{
    display:inline-block;
    padding:2px 9px;
    border-radius:5px;
    background:var(--green-soft);
    color:var(--green);
    font-family:var(--mono);
    font-size:12px;
    margin-right:6px;
  }

  .achieve-list{
    list-style:none;
    margin:0; padding:0;
    display:grid; gap:8px;
  }
  .achieve-list li{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:14.5px;
  }
  .achieve-list .check{
    color:var(--green);
    font-family:var(--mono);
    flex:none;
    margin-top:1px;
  }

  /* ---------- contact ---------- */
  .contact-line{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    font-family:var(--mono);
    font-size:14px;
  }
  .contact-line .prompt{ color:var(--green); }
  .contact-line a{
    color:var(--accent);
    text-decoration:none;
    border-bottom:1px solid rgba(232,163,61,0.4);
  }
  .contact-line a:hover{ border-bottom-color:var(--accent); }
  .contact-line a:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  .copy-btn{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
    background:transparent;
    border:1px solid var(--border);
    border-radius:6px;
    padding:4px 10px;
    cursor:pointer;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .copy-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .copy-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .copy-btn.copied{ color:var(--green); border-color:var(--green); }

  footer{
    margin-top:40px;
    text-align:center;
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--text-muted);
  }

  @media (max-width:520px){
    .field{ grid-template-columns:72px 1fr; }
    .wrap{ padding:44px 14px 60px; }
  }

  @media (prefers-reduced-motion: reduce){
    .boot-line, h1.name, .tagline, .meta-row{ animation:none; opacity:1; }
    .cursor, .dot.blink{ animation:none; opacity:1; }
    .panel-body{ transition:none; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="window">
    <div class="window-bar">
      <div class="tab"><span class="dot blink"></span> profile.log</div>
      <span class="issue-badge">● OPEN · 함께할 팀을 찾는 중</span>
    </div>

    <div class="hero">
      <div class="boot-line"><span class="prompt">$</span>whoami --student</div>
      <h1 class="name">김예찬</h1>
      <p class="tagline">숨겨진 버그를 찾아내는 버그 탐색자<span class="cursor" aria-hidden="true"></span></p>
      <div class="meta-row">
        <span><span class="k">SCHOOL</span> 유한대학교</span>
        <span><span class="k">MAJOR</span> 컴퓨터공학과 · 게임콘텐츠전공</span>
        <span><span class="k">TERM</span> 2022.03 – 2027.02</span>
      </div>
    </div>
  </div>

  <div class="panels">

    <section class="panel" id="panel-project">
      <button class="panel-header" aria-expanded="true" aria-controls="body-project">
        <span class="fold">▾</span>
        <span class="title">프로젝트 — 3D게임엔진</span>
        <span class="sub">2026.03 – 2026.06</span>
      </button>
      <div class="panel-body" id="body-project">
        <div class="field">
          <span class="k">구분</span>
          <span class="v">기능 개발</span>
        </div>
        <div class="field">
          <span class="k">역할</span>
          <span class="v">개발담당</span>
        </div>
        <div class="field">
          <span class="k">기술</span>
          <span class="v"><span class="tag">Unity</span></span>
        </div>
        <div class="field">
          <span class="k">성과</span>
          <ul class="achieve-list">
            <li><span class="check">✓</span> 게임 기능 구현</li>
            <li><span class="check">✓</span> UI 제작</li>
          </ul>
        </div>
      </div>
    </section>

    <section class="panel" id="panel-edu">
      <button class="panel-header" aria-expanded="true" aria-controls="body-edu">
        <span class="fold">▾</span>
        <span class="title">학력</span>
        <span class="sub">재학중</span>
      </button>
      <div class="panel-body" id="body-edu">
        <div class="field">
          <span class="k">학교</span>
          <span class="v">유한대학교</span>
        </div>
        <div class="field">
          <span class="k">학과</span>
          <span class="v">컴퓨터공학과 - 게임콘텐츠전공</span>
        </div>
        <div class="field">
          <span class="k">기간</span>
          <span class="v">2022.03 – 2027.02</span>
        </div>
      </div>
    </section>

    <section class="panel" id="panel-contact">
      <button class="panel-header" aria-expanded="true" aria-controls="body-contact">
        <span class="fold">▾</span>
        <span class="title">연락처</span>
      </button>
      <div class="panel-body" id="body-contact">
        <div class="contact-line">
          <span class="prompt">$</span>
          <a href="mailto:kknsde@naver.com">kknsde@naver.com</a>
          <button class="copy-btn" id="copyBtn" type="button">복사</button>
        </div>
      </div>
    </section>

  </div>

  <footer>© 2026 김예찬</footer>
</div>

<script>
  // panel collapse/expand
  document.querySelectorAll('.panel-header').forEach(function(btn){
    btn.addEventListener('click', function(){
      var panel = btn.closest('.panel');
      var collapsed = panel.classList.toggle('collapsed');
      btn.setAttribute('aria-expanded', String(!collapsed));
    });
  });

  // copy email
  var copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', function(){
    navigator.clipboard.writeText('kknsde@naver.com').then(function(){
      copyBtn.textContent = '복사됨';
      copyBtn.classList.add('copied');
      setTimeout(function(){
        copyBtn.textContent = '복사';
        copyBtn.classList.remove('copied');
      }, 1600);
    });
  });
</script>

</body>
</html>
